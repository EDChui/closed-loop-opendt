[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "k8s-observability"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "kubernetes>=35.0.0",
    "sqlalchemy>=2.0.48",
    "psycopg[binary]>=3.3.3",
]

[tool.setuptools.packages.find]
include = ["k8s_observability*"]